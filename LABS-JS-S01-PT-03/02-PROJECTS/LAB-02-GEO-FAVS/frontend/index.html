<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapitas 🗺️ Hackers</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <h1>Mapitas 🗺️ Hackers</h1>

    <section>
        <h2>Form Data Test</h2>
        <div>
            <form id="userForm">
                <label>Role ID</label><br />
                <input id="roleId" value="1" /><br />
                
                <label>Nickname</label><br />
                <input id="nickname" value="Joshua One" /><br />
                
                <label>Name</label><br />
                <input id="name" value="Joshua" /><br />
                
                <label>Email</label><br />
                <input id="email" value="joshua@jhsjhs.com" /><br />
                
                <label>Password</label><br />
                <input id="password" value="joshuapassword" /><br />
                
                <input type="submit" id="userSubmit" /><br />
            </form>
        </div>
    </section>

    <section>
        <h2>Cámara 📷</h2>
        <div>
            <button id="startCam">📷 Iniciar Cámara</button>
            <button id="stopCam">⏹️ Detener Cámara</button>
            <div id="errorCam"></div>
        </div>

        <div id="videoContainer">
            <video id="cameraPreview" autoplay playsinline></video>
        </div>
    </section>

    <section>        
        <h2>Location 🗺️</h2>
        <button id="locateBtn">📍 Mi ubicación</button>
        <div id="statusText"></div>
        <div id="map"></div>
    </section>

    <script type="module" src="js/app.js"></script>
</body>
</html>
